<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Photos - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navigation */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: #18181c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #007aff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .camera-trigger-btn {
            background: #007aff;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .camera-trigger-btn:hover {
            background: #0056b3;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #3a3a3c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Container & Layout */
        .main-container {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Section Titles */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f4f4f5;
        }

        /* Albums Grid */
        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .album-card {
            background: #1c1c21;
            border-radius: 16px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .album-card:hover {
            transform: translateY(-4px);
            background: #24242b;
        }

        .album-cover {
            width: 100%;
            height: 120px;
            border-radius: 12px;
            background: #2a2a30;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .album-title {
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .album-count {
            font-size: 0.75rem;
            color: #a1a1aa;
        }

        /* Photo Feed Gallery */
        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .photo-card {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #27272a;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.8) 100%);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            align-items: flex-end;
            padding: 12px;
            font-size: 0.8rem;
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        /* Quick Action Bar */
        .floating-camera-fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #007aff;
            color: #fff;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
            text-decoration: none;
            z-index: 40;
            transition: transform 0.2s;
        }

        .floating-camera-fab:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="logo">
            📷 Focus Photos
        </div>
        <div class="nav-actions">
            <a href="/camera" class="camera-trigger-btn">📷 Camera</a>
            <div class="user-avatar" title="Profile">ME</div>
        </div>
    </header>

    <!-- Main Dashboard Content -->
    <main class="main-container">

        <!-- Albums Section -->
        <section class="albums-section">
            <div class="section-header">
                <h2 class="section-title">My Albums</h2>
            </div>
            <div class="albums-grid">
                <div class="album-card">
                    <div class="album-cover">📁</div>
                    <div class="album-title">Favorites</div>
                    <div class="album-count">12 Photos</div>
                </div>
                <div class="album-card">
                    <div class="album-cover">🌆</div>
                    <div class="album-title">Recent Captures</div>
                    <div class="album-count">24 Photos</div>
                </div>
                <div class="album-card">
                    <div class="album-cover">🎨</div>
                    <div class="album-title">Edited</div>
                    <div class="album-count">8 Photos</div>
                </div>
            </div>
        </section>

        <!-- All Photos Section -->
        <section class="photos-section">
            <div class="section-header">
                <h2 class="section-title">All Photos</h2>
            </div>
            <div class="photos-grid">
                <div class="photo-card">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#52525b;">Sample Photo 1</div>
                </div>
                <div class="photo-card">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#52525b;">Sample Photo 2</div>
                </div>
                <div class="photo-card">
                    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#52525b;">Sample Photo 3</div>
                </div>
            </div>
        </section>

    </main>

    <!-- Floating Quick Camera FAB Button -->
    <a href="/camera" class="floating-camera-fab" title="Open Camera">📷</a>

</body>
</html>
