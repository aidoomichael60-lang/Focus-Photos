<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Photos - Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #2c2c2e;
            max-width: 800px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #0a84ff;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-secondary {
            background-color: #1c1c1e;
            color: #0a84ff;
            border: 1px solid #2c2c2e;
        }

        .gallery-container {
            max-width: 800px;
            margin: 30px auto;
        }

        .gallery-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #8e8e93;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .grid-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1c1c1e;
            border: 1px solid #2c2c2e;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #8e8e93;
            background-color: #1c1c1e;
            border-radius: 16px;
            border: 1px solid #2c2c2e;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Focus Photos</h1>
        <div class="actions">
            <!-- Native Direct File Capture Form -->
            <form action="{{ url_for('upload_photo') }}" method="POST" enctype="multipart/form-data" id="quick-upload-form">
                <input type="file" name="photo" id="quick-cam" accept="image/*" capture="environment" style="display: none;" onchange="document.getElementById('quick-upload-form').submit()">
                <button type="button" class="btn btn-secondary" onclick="document.getElementById('quick-cam').click()">⚡ Quick Snap</button>
            </form>

            <!-- Dedicated Camera Page -->
            <a href="{{ url_for('camera_page') }}" class="btn">📸 Open Camera</a>
        </div>
    </div>

    <div class="gallery-container">
        <h2 class="gallery-title">Your Gallery</h2>

        {% if photos %}
            <div class="grid">
                {% for photo in photos %}
                    <div class="grid-item">
                        <img src="{{ url_for('uploaded_file', filename=photo) }}" alt="Photo">
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty-state">
                <p style="font-size: 16px; margin-bottom: 8px;">No photos taken yet.</p>
                <p style="font-size: 13px;">Tap <strong>Quick Snap</strong> or <strong>Open Camera</strong> above to capture your first photo.</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
