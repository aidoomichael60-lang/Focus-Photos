<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Focus Photos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #0f172a; color: #f8fafc; padding: 20px; }

    /* Glowing Red & Blue Rounded Border */
    .auth-wrapper {
      position: relative;
      padding: 3px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ef4444 0%, #3b82f6 100%);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.35), 0 0 25px rgba(59, 130, 246, 0.35);
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 21px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h2 { font-size: 22px; text-align: center; font-weight: 700; margin-bottom: 5px; }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.875rem; color: #cbd5e1; }
    .input-container { position: relative; display: flex; align-items: center; }

    input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 0.875rem;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }

    .toggle-password {
      position: absolute; right: 0.75rem; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.85rem; user-select: none;
    }

    .submit-btn {
      margin-top: 0.5rem; padding: 0.85rem; border-radius: 10px; border: none;
      background: linear-gradient(90deg, #ef4444, #3b82f6);
      color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }

    .alert { background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; }
    .link { text-align: center; font-size: 14px; color: #94a3b8; }
    .link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Sign In</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label>Password</label>
          <div class="input-container">
            <input type="password" name="password" id="login-pass" placeholder="Enter password" required>
            <button type="button" class="toggle-password" onclick="togglePass('login-pass', this)">Show</button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="link">
        Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
      </div>
    </div>
  </div>

  <script>
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }
  </script>
</body>
</html>
