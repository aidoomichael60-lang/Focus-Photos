<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera - Focus Photos</title>

    <!-- iOS & PWA Integration -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Focus Photos">

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .camera-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        video, canvas {
            width: 100%;
            border-radius: 12px;
            background: #000;
            border: 2px solid #1a73e8;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button, .btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-secondary {
            background-color: #3c4043;
        }
        #status-msg {
            margin-top: 15px;
            font-size: 14px;
            color: #00f0ff;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <h2 style="margin-bottom: 15px;">Capture Photo</h2>
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>

        <div class="controls">
            <button id="snap-btn" onclick="takePhoto()">📷 Take & Save Photo</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Back to Gallery</a>
        </div>

        <p id="status-msg"></p>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusMsg = document.getElementById('status-msg');

        // Access camera (rear camera prioritized)
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { 
                statusMsg.style.color = '#ff4d4d';
                statusMsg.innerText = "Error accessing camera: " + err.message; 
            });

        function takePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            statusMsg.style.color = '#00f0ff';
            statusMsg.innerText = "Saving photo to cloud...";

            canvas.toBlob(blob => {
                const formData = new FormData();
                const filename = `photo_${Date.now()}.png`;
                formData.append('photo', blob, filename);

                fetch('/upload-photo', {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.url) {
                        statusMsg.style.color = '#00f0ff';
                        statusMsg.innerText = "Photo saved! View it in your dashboard gallery.";
                    } else {
                        statusMsg.style.color = '#ff4d4d';
                        statusMsg.innerText = "Upload failed: " + (data.error || "Unknown error");
                    }
                })
                .catch(err => {
                    statusMsg.style.color = '#ff4d4d';
                    statusMsg.innerText = "Network error saving photo.";
                });
            }, 'image/png');
        }
    </script>
</body>
</html>
