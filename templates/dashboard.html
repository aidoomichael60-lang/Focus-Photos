<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Photos - Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0c0d12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 600px;
            background: #12141c;
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #00d2ff;
        }

        p.subtitle {
            color: #a0a5b5;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 30px;
        }

        .action-card {
            background: #181b26;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .action-card:hover {
            transform: translateY(-3px);
            border-color: #00d2ff;
        }

        .action-card .icon {
            font-size: 2rem;
        }

        .action-card span {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .app-gallery-title {
            text-align: left;
            font-size: 1.1rem;
            margin-bottom: 16px;
            border-bottom: 1px solid #222;
            padding-bottom: 8px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            min-height: 120px;
        }

        .gallery-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .empty-msg {
            grid-column: 1 / -1;
            color: #666;
            font-size: 0.85rem;
            padding: 30px 0;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Focus Photos Dashboard</h1>
        <p class="subtitle">Welcome to your app! Choose an action below:</p>

        <div class="action-grid">
            <a href="/camera" class="action-card">
                <span class="icon">📷</span>
                <span>Open Camera</span>
            </a>
            <a href="/verify-otp" class="action-card">
                <span class="icon">🔐</span>
                <span>Re-verify OTP</span>
            </a>
        </div>

        <h2 class="app-gallery-title">Saved App Photos</h2>
        <div id="gallery-container" class="gallery-grid">
            <p class="empty-msg">No saved photos yet. Tap "Open Camera" to take one!</p>
        </div>
    </div>

    <script>
        // Load photos saved locally in the browser
        document.addEventListener('DOMContentLoaded', () => {
            const galleryContainer = document.getElementById('gallery-container');
            const appPhotos = JSON.parse(localStorage.getItem('app_photos') || '[]');

            if (appPhotos.length > 0) {
                galleryContainer.innerHTML = '';
                appPhotos.reverse().forEach(photo => {
                    const img = document.createElement('img');
                    img.src = photo.data;
                    img.className = 'gallery-img';
                    galleryContainer.appendChild(img);
                });
            }
        });
    </script>
</body>
</html>
