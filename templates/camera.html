<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Photos - Pro Camera</title>
    <link rel="stylesheet" href="camera.css">
</head>
<body>
    <div class="camera-container">
        <!-- Live Video Viewfinder -->
        <div class="viewfinder-wrapper">
            <video id="cameraFeed" autoplay playsinline muted></video>
            <div id="liveBadge" class="live-badge hidden">LIVE</div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-panel">
            <!-- Filter Selection Bar -->
            <div class="filter-bar">
                <button class="filter-btn active" onclick="applyFilter('none')">Original</button>
                <button class="filter-btn" onclick="applyFilter('vivid')">Vivid</button>
                <button class="filter-btn" onclick="applyFilter('vivid-warm')">Vivid Warm</button>
                <button class="filter-btn" onclick="applyFilter('vivid-cool')">Vivid Cool</button>
                <button class="filter-btn" onclick="applyFilter('mono')">Mono</button>
                <button class="filter-btn" onclick="applyFilter('noir')">Noir</button>
            </div>

            <!-- Zoom Control Slider -->
            <div class="zoom-container">
                <label for="zoomRange">Zoom: <span id="zoomVal">1.0</span>x</label>
                <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" oninput="updateZoom(this.value)">
            </div>

            <!-- Top Toolbar Buttons -->
            <div class="toolbar">
                <button id="liveToggleBtn" onclick="toggleLiveMode()">Live: OFF</button>
                <button id="torchBtn" onclick="toggleFlash()">⚡ Flash</button>
                <button id="flipBtn" onclick="switchCamera()">🔄 Switch</button>
            </div>

            <!-- Capture Action Button -->
            <div class="shutter-wrapper">
                <button class="shutter-btn" onclick="takeSnapshot()"></button>
            </div>
        </div>
    </div>

    <script src="camera.js"></script>
</body>
</html>
