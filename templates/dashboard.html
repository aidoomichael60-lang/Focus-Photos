<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Focus Photos</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#00f0ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Focus Photos">

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,240,255,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            object-fit: cover;
            margin-bottom: 15px;
            background-color: #000;
        }
        h2 {
            margin-top: 10px;
            color: #00f0ff;
            font-size: 20px;
        }
        p {
            color: #aaa;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            color: #121212;
            background-color: #00f0ff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
        .btn-logout {
            background-color: #ff4d4d;
            color: #fff;
            margin-left: 10px;
        }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}")
            .then(reg => console.log('Service Worker registered successfully!', reg))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
</head>
<body>
    <div class="container">
        <!-- Display custom logo as user profile picture -->
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Focus Photos Logo" class="profile-img">
        
        <h2>Welcome Back!</h2>
        <p>Logged in as: <strong>{{ email }}</strong></p>

        <div style="margin-top: 20px;">
            <a href="{{ url_for('camera') }}" class="btn">Open Camera</a>
            <a href="{{ url_for('logout') }}" class="btn btn-logout">Logout</a>
        </div>
    </div>
</body>
</html>
