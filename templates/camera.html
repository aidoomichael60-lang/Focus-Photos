<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Focus Photos - Camera</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .camera-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 14px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            z-index: 30;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: 600;
        }

        .viewfinder-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121214;
        }

        #camera-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Two-Line Sliders Popup Container (Hidden by default) */
        .slider-controls-popup {
            position: absolute;
            bottom: 20px;
            left: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 25;
            background: rgba(0, 0, 0, 0.75);
            padding: 14px 18px;
            border-radius: 16px;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: opacity 0.2s, transform 0.2s;
        }

        .slider-controls-popup.hidden {
            display: none;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .slider-group span {
            width: 60px;
        }

        .slider-group input[type="range"] {
            flex: 1;
            accent-color: #007aff;
            height: 4px;
        }

        .camera-bottom-bar {
            background: #000000;
            padding: 14px 0 24px 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 30;
        }

        .filter-carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 20px;
            scrollbar-width: none;
        }

        .filter-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            opacity: 0.55;
            flex-shrink: 0;
        }

        .filter-option.active {
            opacity: 1;
        }

        .filter-thumb {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .shutter-row {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shutter-btn {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .shutter-inner {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- Top Bar with Two-Line Toggle Button -->
        <div class="camera-top-bar">
            <button class="icon-btn" onclick="window.location.href='/dashboard'">← Dashboard</button>
            <button id="btn-toggle-sliders" class="icon-btn">🎛️ Sliders</button>
            <button id="btn-flash" class="icon-btn">⚡ Flash</button>
            <button id="btn-grid" class="icon-btn">🌐 Grid</button>
            <button id="btn-flip" class="icon-btn">🔄 Flip</button>
        </div>

        <!-- Live Viewfinder -->
        <div class="viewfinder-wrapper">
            <video id="camera-video" autoplay playsinline muted></video>

            <!-- Sliders popup (Now hidden until 🎛️ Sliders button is clicked) -->
            <div id="slider-popup" class="slider-controls-popup hidden">
                <div class="slider-group">
                    <span>🔵 Zoom</span>
                    <input type="range" id="slider-zoom" min="1" max="4" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <span>☀️ EV</span>
                    <input type="range" id="slider-ev" min="-2" max="2" step="0.5" value="0">
                </div>
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="camera-bottom-bar">
            <div class="filter-carousel">
                <div class="filter-option active"><div class="filter-thumb" style="background:#444;"></div><span style="font-size:0.7rem;">Normal</span></div>
                <div class="filter-option"><div class="filter-thumb" style="background:linear-gradient(45deg, #ff0055, #ffaa00);"></div><span style="font-size:0.7rem;">Vivid</span></div>
                <div class="filter-option"><div class="filter-thumb" style="background:#000;"></div><span style="font-size:0.7rem;">B&W</span></div>
            </div>

            <div class="shutter-row">
                <button class="shutter-btn"><div class="shutter-inner"></div></button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const video = document.getElementById('camera-video');
        const sliderPopup = document.getElementById('slider-popup');
        const toggleSlidersBtn = document.getElementById('btn-toggle-sliders');

        // Toggle two-line sliders on/off when clicked
        toggleSlidersBtn.addEventListener('click', () => {
            sliderPopup.classList.toggle('hidden');
            toggleSlidersBtn.classList.toggle('active');
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                console.error(err);
            }
        }
        startCamera();
    });
    </script>
</body>
</html>
