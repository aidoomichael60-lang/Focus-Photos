<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Focus Photos</title>

    <!-- PWA Settings -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#00f0ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Focus Photos">

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00f0ff;
            object-fit: cover;
            background-color: #000;
        }
        h2 {
            color: #00f0ff;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        p {
            color: #aaa;
            margin: 0;
            font-size: 14px;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #00f0ff;
        }
        .card-icon {
            font-size: 30px;
            margin-bottom: 8px;
            display: block;
        }
        .card-title {
            font-weight: bold;
            font-size: 15px;
            color: #00f0ff;
        }
        .btn-logout {
            background-color: #ff4d4d;
            color: #fff;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
        });
      }
    </script>
</head>
<body>

    <div class="header">
        <img src="{{ url_for('static', filename='logo.png') }}" 
             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1042/1042339.png';" 
             alt="Focus Photos Logo" 
             class="profile-img">
        <h2>Focus Photos Dashboard</h2>
        <p>Logged in as: <strong>{{ email }}</strong></p>
    </div>

    <!-- Dashboard Features Grid -->
    <div class="features-grid">
        <a href="{{ url_for('camera') }}" class="card">
            <span class="card-icon">📷</span>
            <span class="card-title">Camera</span>
        </a>
        
        <a href="#" class="card">
            <span class="card-icon">🖼️</span>
            <span class="card-title">Gallery</span>
        </a>

        <a href="#" class="card">
            <span class="card-icon">⚙️</span>
            <span class="card-title">Settings</span>
        </a>
    </div>

    <a href="{{ url_for('logout') }}" class="btn-logout">Logout</a>

</body>
</html>
