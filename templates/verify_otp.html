<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Focus Photos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0c0d12;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* OTP Card Container */
        .otp-card {
            position: relative;
            width: 100%;
            max-width: 420px;
            background: #12141c;
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            overflow: hidden; /* Clips outer glowing pseudo-elements cleanly */
        }

        .otp-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00d2ff, transparent);
        }

        .otp-card::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            width: 60%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00d2ff, transparent);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .card-subtitle {
            font-size: 0.88rem;
            color: #a0a5b5;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* Info Alert Banner */
        .info-alert {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 0.82rem;
            padding: 10px 14px;
            border-radius: 24px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* OTP Input Field */
        .otp-input {
            width: 100%;
            padding: 14px;
            background: #090a0f;
            border: 1.5px solid #00d2ff;
            border-radius: 28px;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: #00d2ff;
            border: none;
            border-radius: 28px;
            color: #000000;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .btn-submit:hover {
            background: #38bdf8;
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.4);
        }

        .resend-text {
            font-size: 0.82rem;
            color: #a0a5b5;
        }

        .resend-link {
            color: #ef4444;
            text-decoration: none;
            font-weight: 600;
            display: block;
            margin-top: 6px;
        }

        .resend-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="otp-card">
        <div class="card-header">
            <span style="color: #ef4444;">🛡️</span> VERIFY OTP <span style="color: #00d2ff;">🔑</span>
        </div>

        <p class="card-subtitle">Enter the 6-digit verification code sent to your Gmail or Phone.</p>

        {% if message %}
            <div class="info-alert">
                {{ message }}
            </div>
        {% endif %}

        <form method="POST" action="/verify-otp">
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="______" required autofocus autocomplete="off">
            <button type="submit" class="btn-submit">Verify & Activate</button>
        </form>

        <div class="resend-text">
            Didn't receive the code?
            <a href="/verify-otp" class="resend-link">Resend OTP Code</a>
        </div>
    </div>

</body>
</html>
