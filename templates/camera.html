<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera - Focus Photos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #000000; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; padding: 20px; }
        .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .header h2 { font-size: 18px; font-weight: 600; }
        .btn-back { color: #0a84ff; text-decoration: none; font-size: 15px; font-weight: 500; }
        .camera-card { background-color: #1c1c1e; border: 1px solid #2c2c2e; border-radius: 20px; padding: 40px 20px; text-align: center; width: 100%; max-width: 480px; margin: auto 0; }
        .btn-capture { background: #0a84ff; color: #ffffff; border: none; padding: 16px 32px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
        .status-msg { margin-top: 15px; font-size: 14px; color: #30d158; min-height: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Take Photo</h2>
        <a href="{{ url_for('dashboard') }}" class="btn-back">Cancel</a>
    </div>

    <div class="camera-card">
        <p style="font-size: 14px; color: #8e8e93; margin-bottom: 25px;">
            Tap below to open your phone's full native camera.
        </p>

        <form action="{{ url_for('upload_photo') }}" method="POST" enctype="multipart/form-data" id="camera-form">
            <input type="file" name="photo" id="camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleFileSelected()">
            
            <button type="button" class="btn-capture" onclick="document.getElementById('camera-input').click()">
                📸 Launch Camera
            </button>
        </form>

        <p id="status-msg" class="status-msg"></p>
    </div>

    <div style="margin-bottom: 10px;">
        <a href="{{ url_for('dashboard') }}" style="color: #8e8e93; text-decoration: none; font-size: 14px;">Back to Dashboard</a>
    </div>

    <script>
        function handleFileSelected() {
            const input = document.getElementById('camera-input');
            const status = document.getElementById('status-msg');
            
            if (input.files && input.files[0]) {
                status.innerText = "Uploading photo to gallery...";
                document.getElementById('camera-form').submit();
            }
        }
    </script>

</body>
</html>
