<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Photos - Enter Verification Code</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #fff; padding: 40px 30px; border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; border: 1px solid #e0e0e0; }
        h2 { margin-bottom: 8px; color: #1f1f1f; }
        p { color: #5f6368; font-size: 0.9rem; margin-bottom: 12px; line-height: 1.4; }
        .destination-tag { background: #e8f0fe; color: #0b57d0; font-weight: 600; padding: 6px 12px; border-radius: 12px; display: inline-block; margin-bottom: 20px; font-size: 0.85rem; word-break: break-all; }
        input[type="text"] { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #ccc; font-size: 1.5rem; text-align: center; letter-spacing: 6px; outline: none; margin-bottom: 20px; }
        input[type="text"]:focus { border-color: #0b57d0; box-shadow: 0 0 0 2px rgba(11,87,208,0.2); }
        button { width: 100%; background: #0b57d0; color: #fff; border: none; padding: 14px; border-radius: 28px; font-weight: 600; font-size: 1rem; cursor: pointer; }
        button:hover { background: #1a73e8; }
        .flash { color: #dc2626; font-size: 0.85rem; margin-bottom: 12px; }
        .resend-link { display: inline-block; margin-top: 16px; color: #0b57d0; text-decoration: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <span style="font-size: 3rem;">🔑</span>
        <h2>Enter Verification Code</h2>
        <p>A 6-digit verification code was sent to:</p>
        <div class="destination-tag">{{ destination }}</div>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="flash">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="otp" placeholder="123456" maxlength="6" required autofocus autocomplete="off">
            <button type="submit">Verify & Log In</button>
        </form>

        <a href="/" class="resend-link">← Back to Login</a>
    </div>
</body>
</html>
