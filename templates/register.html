<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Focus Photos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #0f172a; color: #f8fafc; padding: 20px; }

    .auth-wrapper {
      position: relative;
      padding: 3px;
      border-radius: 24px;
      background: linear-gradient(135deg, #ef4444 0%, #3b82f6 100%);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.35), 0 0 25px rgba(59, 130, 246, 0.35);
      width: 100%;
      max-width: 420px;
    }

    .auth-card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 21px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h2 { font-size: 22px; text-align: center; font-weight: 700; }

    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.875rem; color: #cbd5e1; }
    .input-container { position: relative; display: flex; align-items: center; }

    input {
      width: 100%;
      padding: 0.75rem 2.5rem 0.75rem 0.875rem;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }

    .toggle-password { position: absolute; right: 0.75rem; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.85rem; }
    .suggest-btn { align-self: flex-start; background: none; border: none; color: #60a5fa; font-size: 0.8rem; cursor: pointer; text-decoration: underline; padding: 0; }

    .strength-meter { height: 4px; width: 100%; background: #334155; border-radius: 2px; overflow: hidden; margin-top: 0.25rem; }
    .strength-bar { height: 100%; width: 0%; transition: width 0.3s, background-color 0.3s; }
    .strength-text { font-size: 0.75rem; color: #94a3b8; }

    .submit-btn {
      margin-top: 0.5rem; padding: 0.85rem; border-radius: 10px; border: none;
      background: linear-gradient(90deg, #ef4444, #3b82f6);
      color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }

    .alert { background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 10px; border-radius: 8px; font-size: 13px; text-align: center; }
    .link { text-align: center; font-size: 14px; color: #94a3b8; }
    .link a { color: #60a5fa; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h2>Create Account</h2>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('register') }}" method="POST" onsubmit="return validateForm()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group" style="margin-top: 10px;">
          <label>Password</label>
          <div class="input-container">
            <input type="password" name="password" id="reg-pass" placeholder="Enter password" oninput="evalStrength(this.value)" required>
            <button type="button" class="toggle-password" id="toggle-btn" onclick="togglePass()">Show</button>
          </div>

          <button type="button" class="suggest-btn" onclick="suggestPassword()">Suggest Strong Password</button>

          <div class="strength-meter">
            <div class="strength-bar" id="strength-bar"></div>
          </div>
          <span class="strength-text" id="strength-text">Requires 8+ chars, uppercase, number & symbol.</span>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
      </form>

      <div class="link">
        Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function togglePass() {
      const input = document.getElementById('reg-pass');
      const btn = document.getElementById('toggle-btn');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function suggestPassword() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
      let pass = "";
      for (let i = 0; i < 14; i++) {
        pass += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      const input = document.getElementById('reg-pass');
      input.value = pass;
      input.type = 'text';
      document.getElementById('toggle-btn').textContent = 'Hide';
      evalStrength(pass);
    }

    function evalStrength(val) {
      const bar = document.getElementById('strength-bar');
      const text = document.getElementById('strength-text');
      let score = 0;

      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;

      if (score <= 1) {
        bar.style.width = '25%'; bar.style.backgroundColor = '#ef4444';
        text.textContent = 'Weak password';
      } else if (score <= 3) {
        bar.style.width = '65%'; bar.style.backgroundColor = '#f59e0b';
        text.textContent = 'Moderate password';
      } else {
        bar.style.width = '100%'; bar.style.backgroundColor = '#10b981';
        text.textContent = 'Strong password';
      }
    }

    function validateForm() {
      const val = document.getElementById('reg-pass').value;
      const isStrong = val.length >= 8 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val);
      if (!isStrong) {
        alert('Please enter a strong password containing at least 8 characters, an uppercase letter, a number, and a symbol.');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
